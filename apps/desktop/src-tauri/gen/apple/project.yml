name: ledgeur
options:
  bundleIdPrefix: com.maxbeech.ledgeur
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Ledgeur
      PRODUCT_BUNDLE_IDENTIFIER: com.maxbeech.ledgeur
      DEVELOPMENT_TEAM: E353LGUVGH
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  ledgeur_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: ledgeur_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: ledgeur_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.3.1
        CFBundleVersion: "0.3.1"
        # The scheme the home-screen and lock-screen widgets open. A widget
        # cannot run app code — a URL is the entire interface it has — so this
        # is what makes one tap from a locked phone reach a live microphone.
        # Declared here as well as in tauri.conf.json because this plist is
        # regenerated from this file, and a scheme that only exists in the
        # generated copy is one `tauri ios init` away from silently vanishing.
        CFBundleURLTypes:
          - CFBundleURLName: com.maxbeech.ledgeur
            CFBundleURLSchemes: [ledgeur]
        # These three were once hand-added to the generated Info.plist, which
        # meant the next `xcodegen generate` silently deleted them. iOS does not
        # warn about a missing usage description: it terminates the app the
        # moment it asks for the microphone, which is both recording and
        # dictation. They live here now because THIS file is what generates
        # that plist. Do not move them back.
        NSMicrophoneUsageDescription: >-
          Ledgeur records meeting audio so it can transcribe it on this phone.
          Audio and transcripts stay on the phone unless you choose to sync them.
        NSAudioCaptureUsageDescription: >-
          Ledgeur captures the meeting audio your Mac is playing so it can
          transcribe the other side of a call. Audio and transcripts stay on your
          machine unless you choose to sync them.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ledgeur_iOS/ledgeur_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: LedgeurWidget
        embed: true
        codeSign: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # The home-screen and lock-screen widgets.
  #
  # Deploys to iOS 16 while the app deploys to 14: the accessory (lock-screen)
  # families do not exist before then, and a lock-screen button is most of the
  # point. On an older system the app is unchanged and the widget is simply not
  # offered.
  #
  # It shares no code and no container with the app — see LedgeurWidget.swift
  # for why a widget that showed real data would be a worse widget.
  LedgeurWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LedgeurWidget
    info:
      path: LedgeurWidget/Info.plist
      properties:
        CFBundleDisplayName: Ledgeur
        # These MUST match ledgeur_iOS's above, exactly. App Store Connect
        # rejects an upload whose extension carries a different version from
        # its host app, and it rejects it after the archive, the signing and
        # the upload — so a one-character drift here costs a whole release
        # cycle to find. Change both together or neither.
        CFBundleShortVersionString: 0.3.1
        CFBundleVersion: "0.3.1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: LedgeurWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.maxbeech.ledgeur.widget
        DEVELOPMENT_TEAM: E353LGUVGH
        INFOPLIST_KEY_CFBundleDisplayName: Ledgeur
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
