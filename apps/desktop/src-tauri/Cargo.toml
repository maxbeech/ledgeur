[package]
name = "ledgeur"
version = "0.2.2"
description = "Ledgeur — the centre of the company's brain"
authors = ["Ledgeur"]
edition = "2021"
rust-version = "1.77.2"

# The library the desktop binary and the mobile entry points both call into.
[lib]
name = "ledgeur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads SENTRY_DSN out of apps/desktop/.env at build time so the frontend
# (VITE_SENTRY_DSN) and native layer (SENTRY_DSN) share one source of truth.
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Local dev logs (terminal + webview devtools console) and prod crash reporting.
tauri-plugin-log = "2"
log = "0.4"
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# On-device AI engines. Optional + behind the `native-ai` feature so the base
# app compiles fast; enable with `cargo build --features native-ai` (or the
# `tauri:build:ai` script) once the native toolchain is set up.
whisper-rs = { version = "0.16", optional = true }
# Defaults on → the sys crate auto-downloads prebuilt sherpa-onnx libs on a
# networked machine. For offline/CI builds, set default-features = false and point
# SHERPA_LIB_PATH at a pre-downloaded lib dir (see docs/NATIVE_AI.md).
sherpa-rs = { version = "0.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
# In-process LLM (copilot, coaching suggestions, post-meeting notes). CPU by
# default; picks up Metal/CUDA/Vulkan where the platform toolchain provides it.
# Pinned exact: 0.1.x has broken its Rust API across patch releases before
# (e.g. LlamaSampler::top_p gained a min_keep param in 0.1.150), and there's
# no CI running `--features native-ai` to catch a silent transitive bump.
llama-cpp-2 = { version = "=0.1.150", optional = true }
encoding_rs = { version = "0.8", optional = true }

# Auto-update: checks GitHub Releases' latest.json, downloads + verifies a
# minisign-signed bundle, installs and relaunches. Desktop only — there is no
# updater on mobile, where the store handles updates.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Native system-audio capture (Core Audio Process Tap, macOS 14.2+) — the
# alternative to getDisplayMedia's screen-share picker. macOS-only + optional:
# `wry` already pulls in objc2/objc2-core-foundation at these versions for its
# own webview glue, so this adds no duplicate copies.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = { version = "0.6", optional = true }
objc2-core-audio = { version = "0.3", features = ["AudioHardware"], optional = true }
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"], optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
# CATapDescription's initializer takes an NSArray<NSNumber> (Foundation, not
# CoreFoundation) of process ids to exclude from the tap.
objc2-foundation = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

[features]
# System audio without a screen-share picker is ON by default: it is the whole
# point of the feature. Left opt-in, it shipped disabled, so every build still
# fell back to getDisplayMedia and users still got the macOS screen-recording
# prompt — the exact thing the module was written to remove. The deps it
# activates are declared under the macOS target only, so this is inert on every
# other platform, and the module's own cfg keeps the command stubs in place
# there (and on macOS older than 14.2, where the API doesn't exist).
default = ["system-audio-tap"]
# Enabled by tauri on desktop builds for custom protocol asset serving.
custom-protocol = ["tauri/custom-protocol"]
# On-device transcription (whisper.cpp), diarization (sherpa-onnx) and model
# downloads. Heavy native build; opt-in.
native-ai = ["dep:whisper-rs", "dep:sherpa-rs", "dep:reqwest", "dep:llama-cpp-2", "dep:encoding_rs"]
# System audio without the screen-share picker (see src/audio/mod.rs). macOS
# 14.2+ only; the command stubs return "unavailable" everywhere else. Opt-in
# like native-ai until it's been verified on real hardware.
system-audio-tap = ["dep:objc2", "dep:objc2-core-audio", "dep:objc2-core-audio-types", "dep:objc2-core-foundation", "dep:objc2-foundation", "dep:block2"]
