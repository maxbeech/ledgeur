# Supabase local config for ParleyNotes. `supabase start` boots the full stack
# locally; `supabase db reset` applies migrations in ./migrations in order.
project_id = "parleynotes"

[db]
major_version = 15

[auth]
# OAuth providers are enabled here once client IDs/secrets are set as env vars.
# ParleyNotes supports Google and Microsoft (Azure) — both personal and work
# accounts — plus SAML SSO for enterprise. See supabase/README.md.
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.azure]
enabled = true
client_id = "env(SUPABASE_AUTH_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_AZURE_SECRET)"
